<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Student Feedback | Phase-6</title>
  <link rel="stylesheet" href="feedback.css">
</head>
<body>
  <main class="workspace">
    <header class="workspace-header">
      <a class="back-link" href="index.html">← <span>Back to dashboard</span></a>
      <p class="eyebrow">Student Feedback</p>
      <h1>Share your feedback</h1>
      <p class="subtitle">Your thoughts help us make the learning experience better.</p>
    </header>

    <section class="workspace-card" aria-label="Submit feedback">
      <form id="feedbackForm">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Ayesha Khan" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="rating">Rating (1–5)</label>
          <input type="number" id="rating" name="rating" min="1" max="5" placeholder="Choose a rating from 1 to 5" required>
        </div>
        <div class="field">
          <label for="comment">Your comments</label>
          <textarea id="comment" name="comment" placeholder="Tell us about your experience..." required></textarea>
        </div>
        <div class="form-actions">
          <button class="primary-button" type="submit">Submit feedback</button>
          <a class="nav-btn" href="view-feedback.html">View saved feedback</a>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <footer class="workspace-footer">Your feedback is saved securely in the Phase-6 workspace.</footer>
  </main>
  <script src="feedback.js"></script>
</body>
</html>
