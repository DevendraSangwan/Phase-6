<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Contact Manager | Phase-6</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <main class="workspace">
    <header class="workspace-header">
      <a class="back-link" href="index.html">← <span>Back to dashboard</span></a>
      <p class="eyebrow">Contact Manager</p>
      <h1>Get in touch</h1>
      <p class="subtitle">Send us a message and we’ll keep your enquiry organized.</p>
    </header>

    <section class="workspace-card" aria-label="Create a contact">
      <form id="contactForm">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Ali Khan" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="How can we help you?"></textarea>
        </div>
        <div class="form-actions">
          <button class="primary-button" type="submit">Send message</button>
          <a class="nav-btn" href="view-contacts.html">View saved contacts</a>
        </div>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </section>
    <footer class="workspace-footer">Manage all submitted enquiries from your contacts list.</footer>
  </main>
  <script src="contact.js"></script>
</body>
</html>
